<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCE 班級出席與座位表</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    header {
      background: #1f4f46;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    button,
    select,
    input {
      font-size: 16px;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5df;
      background: white;
    }

    button {
      cursor: pointer;
      border: none;
      background: #256f61;
      color: white;
    }

    button.secondary {
      background: #607080;
    }

    button.danger {
      background: #b42318;
    }

    .status {
      margin: 10px 0 18px;
      color: #52606d;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 18px;
    }

    .room {
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 16px;
    }

    .front {
      text-align: center;
      padding: 10px;
      margin-bottom: 16px;
      background: #e8f2ef;
      border: 1px solid #c8ded8;
      border-radius: 6px;
      font-weight: bold;
      color: #1f4f46;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(5, minmax(100px, 1fr));
      gap: 10px;
    }

    .seat {
      min-height: 82px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .seat-number {
      color: #7b8794;
      font-size: 12px;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
    }

    .seat.empty .student-name {
      color: #9aa5b1;
      font-weight: normal;
    }

    .attendance {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .attendance button {
      padding: 5px;
      font-size: 13px;
      border-radius: 4px;
      background: #e4e7eb;
      color: #1f2933;
    }

    .attendance button.active.present {
      background: #1f8f55;
      color: white;
    }

    .attendance button.active.absent {
      background: #c62828;
      color: white;
    }

    .attendance button.active.late {
      background: #b7791f;
      color: white;
    }

    .attendance button.active.leave {
      background: #4c63b6;
      color: white;
    }

    aside {
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 16px;
    }

    aside h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .summary-list {
      display: grid;
      gap: 8px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #f4f6f8;
      border-radius: 6px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      margin-top: 12px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #cbd5df;
      border-radius: 6px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .seats {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 12px;
      }

      .seats {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>GCE 班級出席與座位表</h1>
  </header>

  <main>
    <div class="toolbar">
      <button onclick="loadFromSheet()">重新讀取試算表</button>
      <button class="secondary" onclick="shuffleSeats()">隨機排座位</button>
      <button class="secondary" onclick="exportAttendance()">匯出出席紀錄</button>
      <button class="danger" onclick="clearTodayAttendance()">清除今日出席</button>
    </div>

    <div id="status" class="status">正在讀取學生資料...</div>

    <div class="layout">
      <section class="room">
        <div class="front">講台</div>
        <div id="seats" class="seats"></div>
      </section>

      <aside>
        <h2>今日統計</h2>
        <div class="summary-list">
          <div class="summary-item"><span>學生總數</span><strong id="totalCount">0</strong></div>
          <div class="summary-item"><span>出席</span><strong id="presentCount">0</strong></div>
          <div class="summary-item"><span>缺席</span><strong id="absentCount">0</strong></div>
          <div class="summary-item"><span>遲到</span><strong id="lateCount">0</strong></div>
          <div class="summary-item"><span>請假</span><strong id="leaveCount">0</strong></div>
          <div class="summary-item"><span>未點名</span><strong id="unsetCount">0</strong></div>
        </div>

        <textarea id="exportBox" class="hidden" readonly></textarea>
      </aside>
    </div>
  </main>

  <script>
    const STUDENT_SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW36pvkUZkxKLSefnlEN26fXLuUqDYItWdbDNHModhDufx06jWzCiLAXAn_22Evfuj0nDK_CP10Mic/pub?output=csv";

    const STORAGE_STUDENTS_KEY = "gce_students_from_sheet";
    const STORAGE_ATTENDANCE_KEY = "gce_attendance_by_date";
    const STORAGE_SEATS_KEY = "gce_seats";

    let students = [];
    let seatStudents = [];

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          cell += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && nextChar === "\n") i++;
          row.push(cell.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      if (row.some(value => value !== "")) rows.push(row);

      return rows;
    }

    function normalizeHeader(value) {
      return String(value || "").trim().toLowerCase();
    }

    function findColumn(headers, possibleNames, fallbackIndex) {
      const normalized = headers.map(normalizeHeader);

      for (const name of possibleNames) {
        const index = normalized.indexOf(normalizeHeader(name));
        if (index !== -1) return index;
      }

      return fallbackIndex;
    }

    function rowsToStudents(rows) {
      if (!rows.length) return [];

      const headers = rows[0];

      const nameColumn = findColumn(
        headers,
        ["姓名", "名字", "學生", "學生姓名", "name", "student", "student name"],
        0
      );

      const seatColumn = findColumn(
        headers,
        ["座位", "座號", "座位號碼", "seat", "seat no", "seat number"],
        -1
      );

      return rows
        .slice(1)
        .map((row, index) => {
          const name = String(row[nameColumn] || "").trim();
          const seatRaw = seatColumn >= 0 ? String(row[seatColumn] || "").trim() : "";
          const seat = Number.parseInt(seatRaw, 10);

          return {
            id: name || `student-${index + 1}`,
            name,
            seat: Number.isFinite(seat) ? seat : index + 1
          };
        })
        .filter(student => student.name);
    }

    async function loadFromSheet() {
      setStatus("正在從 Google 試算表讀取學生資料...");

      try {
        const response = await fetch(STUDENT_SHEET_CSV_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Google 試算表讀取失敗");
        }

        const csvText = await response.text();
        students = rowsToStudents(parseCSV(csvText));

        if (!students.length) {
          throw new Error("試算表裡沒有讀到學生姓名");
        }

        localStorage.setItem(STORAGE_STUDENTS_KEY, JSON.stringify(students));
        applySeatOrderFromStudents();
        render();

        setStatus(`已從 Google 試算表載入 ${students.length} 位學生。`);
      } catch (error) {
        console.error(error);

        const cachedStudents = JSON.parse(localStorage.getItem(STORAGE_STUDENTS_KEY) || "[]");
        students = cachedStudents;

        if (students.length) {
          applySeatOrderFromStudents();
          render();
          setStatus("無法讀取 Google 試算表，已使用這台裝置的暫存名單。");
        } else {
          render();
          setStatus("無法讀取 Google 試算表，也沒有本機暫存名單。請確認試算表已公開發布。");
        }
      }
    }

    function applySeatOrderFromStudents() {
      const savedSeats = JSON.parse(localStorage.getItem(STORAGE_SEATS_KEY) || "[]");
      const currentNames = new Set(students.map(student => student.name));

      const stillValidSavedSeats = savedSeats.filter(student => currentNames.has(student.name));
      const savedNames = new Set(stillValidSavedSeats.map(student => student.name));
      const newStudents = students.filter(student => !savedNames.has(student.name));

      if (stillValidSavedSeats.length) {
        seatStudents = [...stillValidSavedSeats, ...newStudents];
      } else {
        seatStudents = [...students].sort((a, b) => a.seat - b.seat);
      }

      localStorage.setItem(STORAGE_SEATS_KEY, JSON.stringify(seatStudents));
    }

    function getAttendanceData() {
      return JSON.parse(localStorage.getItem(STORAGE_ATTENDANCE_KEY) || "{}");
    }

    function saveAttendanceData(data) {
      localStorage.setItem(STORAGE_ATTENDANCE_KEY, JSON.stringify(data));
    }

    function getTodayAttendance() {
      const data = getAttendanceData();
      return data[todayKey()] || {};
    }

    function setAttendance(studentName, status) {
      const data = getAttendanceData();
      const date = todayKey();

      if (!data[date]) data[date] = {};

      if (data[date][studentName] === status) {
        delete data[date][studentName];
      } else {
        data[date][studentName] = status;
      }

      saveAttendanceData(data);
      render();
    }

    function render() {
      renderSeats();
      renderSummary();
    }

    function renderSeats() {
      const container = document.getElementById("seats");
      const attendance = getTodayAttendance();

      container.innerHTML = "";

      if (!seatStudents.length) {
        container.innerHTML = '<div class="seat empty"><div class="student-name">尚未載入學生</div></div>';
        return;
      }

      seatStudents.forEach((student, index) => {
        const currentStatus = attendance[student.name] || "";

        const seat = document.createElement("div");
        seat.className = "seat";
        seat.innerHTML = `
          <div class="seat-number">座位 ${index + 1}</div>
          <div class="student-name">${escapeHTML(student.name)}</div>
          <div class="attendance">
            <button class="${currentStatus === "present" ? "active present" : ""}" onclick="setAttendance('${escapeJS(student.name)}', 'present')">出席</button>
            <button class="${currentStatus === "absent" ? "active absent" : ""}" onclick="setAttendance('${escapeJS(student.name)}', 'absent')">缺席</button>
            <button class="${currentStatus === "late" ? "active late" : ""}" onclick="setAttendance('${escapeJS(student.name)}', 'late')">遲到</button>
            <button class="${currentStatus === "leave" ? "active leave" : ""}" onclick="setAttendance('${escapeJS(student.name)}', 'leave')">請假</button>
          </div>
        `;

        container.appendChild(seat);
      });
    }

    function renderSummary() {
      const attendance = getTodayAttendance();
      const values = Object.values(attendance);

      const total = seatStudents.length;
      const present = values.filter(value => value === "present").length;
      const absent = values.filter(value => value === "absent").length;
      const late = values.filter(value => value === "late").length;
      const leave = values.filter(value => value === "leave").length;
      const unset = total - present - absent - late - leave;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("presentCount").textContent = present;
      document.getElementById("absentCount").textContent = absent;
      document.getElementById("lateCount").textContent = late;
      document.getElementById("leaveCount").textContent = leave;
      document.getElementById("unsetCount").textContent = unset;
    }

    function shuffleSeats() {
      seatStudents = [...seatStudents];

      for (let i = seatStudents.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [seatStudents[i], seatStudents[j]] = [seatStudents[j], seatStudents[i]];
      }

      localStorage.setItem(STORAGE_SEATS_KEY, JSON.stringify(seatStudents));
      render();
      setStatus("已隨機重新排列座位。");
    }

    function clearTodayAttendance() {
      if (!confirm("確定要清除今天的出席紀錄嗎？")) return;

      const data = getAttendanceData();
      delete data[todayKey()];
      saveAttendanceData(data);
      render();
      setStatus("已清除今日出席紀錄。");
    }

    function exportAttendance() {
      const attendance = getTodayAttendance();

      const statusText = {
        present: "出席",
        absent: "缺席",
        late: "遲到",
        leave: "請假"
      };

      const lines = [
        `日期,座位,姓名,狀態`,
        ...seatStudents.map((student, index) => {
          const status = statusText[attendance[student.name]] || "未點名";
          return `${todayKey()},${index + 1},${student.name},${status}`;
        })
      ];

      const exportBox = document.getElementById("exportBox");
      exportBox.classList.remove("hidden");
      exportBox.value = lines.join("\n");
      exportBox.select();

      setStatus("已產生出席紀錄，可直接複製。");
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJS(value) {
      return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
    }

    window.addEventListener("DOMContentLoaded", loadFromSheet);
  </script>
</body>
</html>
